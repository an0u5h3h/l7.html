<!DOCTYPE html>
<html>
    <head>
        <title>zombie apocalypse</title>
        <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
        <script src="zombie.js"></script>
    </head>
<body>
    <a-scene>
        <a-assets>
            <a-asset-item id="z1" src="zombie/scene.gltf"></a-asset-item>
            <a-asset-item id="z2" src="zombie_bust/scene.gltf"></a-asset-item>
            <a-asset-item id="radiation" src="radiation_environment/scene.gltf"></a-asset-item>
        </a-assets>
        <a-entity gltf-model="#radiation"
        position="-10 0 -12"
        scale="2 2 2"
        animation-mixer>
anousheh
        </a-entity>
        <a-entity gltf-model="#z2"
        position="30 0 -90"
        scale="0.5 0.5 0.5"
        animation-mixer></a-entity>
    </a-scene>
</body>
</html>
